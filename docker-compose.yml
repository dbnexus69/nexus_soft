# Base de datos y Storage locales para desarrollo y pruebas (spec 038). Producción NO usa esto: sigue en Supabase.
# Todas las contraseñas y claves de aquí son de mentira y solo valen en esta máquina.
#
#   docker compose up -d --wait     levanta todo
#   docker compose down             lo apaga (los datos quedan en los volúmenes)
#   docker compose down -v          lo apaga y borra los datos
#
# Solo escucha en 127.0.0.1. Puertos poco comunes, para no chocar con un Postgres ya instalado.
name: nexus-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - nexus_db:/var/lib/postgresql/data
      # Roles y base de Storage. Solo corre la primera vez, con el volumen vacío.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_storage"]
      interval: 3s
      timeout: 3s
      retries: 20

  # La misma API de Storage que usa Supabase, guardando en disco. El código habla con ella igual que en producción.
  storage:
    image: supabase/storage-api:v1.81.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6Im5leHVzLWxvY2FsIiwiaWF0IjoxNzkzNjIzMjU1LCJleHAiOjIxMDg5ODMyNTV9.HCs02dTzaKVVt6wZudugf5c0bipuPBCLNwKjTUdPcCg
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoibmV4dXMtbG9jYWwiLCJpYXQiOjE3OTM2MjMyNTUsImV4cCI6MjEwODk4MzI1NX0.VYQicYkZF7FZheTX_2m2wNHAP1N28zkaZ2IXWWH-k1s
      AUTH_JWT_SECRET: nexus-local-solo-desarrollo-no-es-un-secreto-real
      # Sus tablas van en una base aparte, para que no se mezclen con las de Prisma.
      DATABASE_URL: postgres://postgres:postgres@db:5432/nexus_storage
      DB_INSTALL_ROLES: "true"
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: nexus-local
      TENANT_ID: nexus-local
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - nexus_storage:/var/lib/storage

  # `supabase-js` siempre llama a <SUPABASE_URL>/storage/v1; la API de Storage sirve en la raíz.
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - storage
    ports:
      - "127.0.0.1:54321:80"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  nexus_db:
  nexus_storage:
